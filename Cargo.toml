[package]
name = "aetherfall"
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[features]
# Reads the licensed files from assets/external scrambled by tools/pack-assets.ps1; used by release builds.
packed-assets = []

[dependencies]
bevy = { version = "0.20.0", default-features = false, features = ["2d", "ui", "audio", "wav"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Bevy is slow unoptimized; keep our code debuggable but optimize dependencies.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"

[profile.web-release]
inherits = "release"
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = "debuginfo"

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.20.0", default-features = false, features = ["2d", "ui", "audio", "wav", "web"] }
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Storage"] }
